name: Test permission inputs group E
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with permission group E inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          permission-pull-requests: read
          permission-repository-custom-properties: read
          permission-repository-hooks: read
          permission-repository-projects: read
          permission-secret-scanning-alerts: read
          permission-secrets: read
          permission-security-events: read
          permission-single-file: read
          permission-starring: read
          permission-statuses: read
          permission-team-discussions: read
          permission-vulnerability-alerts: read
          permission-workflows: write

      - name: Assert action failed gracefully (no OIDC available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without OIDC, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without OIDC token available"
