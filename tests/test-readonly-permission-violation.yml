name: Test read-only permission violation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          # 'organization-events' only accepts 'read', not 'write'
          permission-organization-events: write
      - name: Assert action failed due to read-only permission violation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when 'write' is given for a read-only permission, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected 'write' for a read-only permission field"
