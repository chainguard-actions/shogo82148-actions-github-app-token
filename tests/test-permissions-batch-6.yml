name: Test permissions batch 6 - repo-custom-properties, repo-hooks, repo-projects, secret-scanning, secrets, security-events, single-file, starring, statuses, team-discussions, vulnerability-alerts, workflows
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Pass a batch of permission inputs.
      # The action will fail at the OIDC/credential stage (expected in act),
      # but the inputs must be accepted without a validation error.
      - id: action
        uses: .
        continue-on-error: true
        with:
          permission-repository-custom-properties: "read"
          permission-repository-hooks: "read"
          permission-repository-projects: "read"
          permission-secret-scanning-alerts: "read"
          permission-secrets: "read"
          permission-security-events: "read"
          permission-single-file: "read"
          permission-starring: "read"
          permission-statuses: "read"
          permission-team-discussions: "read"
          permission-vulnerability-alerts: "read"
          permission-workflows: "write"

      - name: Assert action failed at credential stage not input validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at credential stage as expected in act environment"
          else
            echo "INFO: action outcome was '$OUTCOME'"
          fi
          echo "PASS"
