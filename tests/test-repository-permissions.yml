name: Test all repository-level permissions
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          app-id: "136245"
          permission-actions: read
          permission-administration: read
          permission-artifact-metadata: read
          permission-attestations: read
          permission-checks: write
          permission-codespaces: read
          permission-dependabot-secrets: read
          permission-deployments: write
          permission-discussions: read
          permission-environments: read
          permission-interaction-limits: read
          permission-merge-queues: read
          permission-metadata: read
          permission-packages: read
          permission-pages: read
          permission-pull-requests: write
          permission-repository-custom-properties: read
          permission-repository-hooks: read
          permission-secret-scanning-alerts: read
          permission-secrets: read
          permission-security-events: read
          permission-single-file: read
          permission-statuses: write
          permission-vulnerability-alerts: read
      - name: Assert token issued, or failed gracefully without OIDC
        env:
          RESULT: ${{ steps.action.outputs.token }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but token output is empty"
              exit 1
            fi
            echo "PASS: token issued"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -n "$RESULT" ]; then
              echo "FAIL: action failed but still set a token"
              exit 1
            fi
            echo "PASS: action failed gracefully (OIDC provider unavailable under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
