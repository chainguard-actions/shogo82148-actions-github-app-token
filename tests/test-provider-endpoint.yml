name: Test provider-endpoint input error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with invalid provider endpoint (expect failure)
        id: action
        uses: .
        with:
          provider-endpoint: "https://invalid.example.com/token"
        continue-on-error: true
      - name: Assert action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid provider endpoint, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected with invalid provider endpoint"
