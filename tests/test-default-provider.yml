name: Test default provider endpoint
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action runs with no inputs (uses defaults).
      # Under act, OIDC is not available, so the action will fail when trying
      # to get the ID token. We verify the action fails gracefully (not a crash
      # or unhandled exception) by checking the step outcome is 'failure'.
      - id: action
        uses: .
        continue-on-error: true
        # No inputs — action uses default provider endpoint and default app-id

      - name: Assert action failed gracefully with default config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no OIDC available), but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when OIDC provider is unavailable (default config)"
