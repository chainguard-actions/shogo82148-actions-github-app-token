name: Test permissions batch 1 - administration, artifact-metadata, attestations, checks, codespaces, repositories
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Pass a batch of permission inputs and the repositories input.
      # The action will fail at the OIDC/credential stage (expected in act),
      # but the inputs must be accepted without a validation error.
      - id: action
        uses: .
        continue-on-error: true
        with:
          repositories: "MDEwOlJlcG9zaXRvcnkx"
          permission-administration: "read"
          permission-artifact-metadata: "read"
          permission-attestations: "read"
          permission-checks: "read"
          permission-codespaces: "read"

      - name: Assert action failed at credential stage not input validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because OIDC/credentials are not available in act.
          # A failure here is expected and acceptable — what matters is that the
          # permission inputs were accepted (no "invalid permissions" error).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at credential stage as expected in act environment"
          else
            echo "INFO: action outcome was '$OUTCOME'"
          fi
          echo "PASS"
