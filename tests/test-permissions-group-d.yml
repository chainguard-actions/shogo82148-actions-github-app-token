name: Test permission inputs group D
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with permission group D inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          permission-organization-personal-access-tokens: read
          permission-organization-plan: read
          permission-organization-projects: read
          permission-organization-secrets: read
          permission-organization-self-hosted-runners: read
          permission-organization-user-blocking: read
          permission-packages: read
          permission-pages: read

      - name: Assert action failed gracefully (no OIDC available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without OIDC, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without OIDC token available"
