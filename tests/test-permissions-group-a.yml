name: Test permission inputs group A
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with permission group A inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          permission-custom-properties-for-organizations: read
          permission-dependabot-secrets: read
          permission-deployments: read
          permission-discussions: read
          permission-email-addresses: read
          permission-enterprise-custom-properties-for-organizations: read
          permission-environments: read
          permission-followers: read

      - name: Assert action failed gracefully (no OIDC available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without OIDC, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without OIDC token available"
