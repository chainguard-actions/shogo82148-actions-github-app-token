name: Test permissions batch 5 - org-plan, org-projects, org-secrets, org-self-hosted-runners, org-user-blocking, packages, pages, profile
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Pass a batch of permission inputs.
      # The action will fail at the OIDC/credential stage (expected in act),
      # but the inputs must be accepted without a validation error.
      - id: action
        uses: .
        continue-on-error: true
        with:
          permission-organization-plan: "read"
          permission-organization-projects: "read"
          permission-organization-secrets: "read"
          permission-organization-self-hosted-runners: "read"
          permission-organization-user-blocking: "read"
          permission-packages: "read"
          permission-pages: "read"
          permission-profile: "write"

      - name: Assert action failed at credential stage not input validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at credential stage as expected in act environment"
          else
            echo "INFO: action outcome was '$OUTCOME'"
          fi
          echo "PASS"
