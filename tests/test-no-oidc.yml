name: Test action fails gracefully without OIDC
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    # NOTE: id-token: write is intentionally NOT set here to simulate
    # an environment where OIDC is unavailable (as under act).
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action (expected to fail without OIDC)
        id: action
        uses: .
        with:
          provider-endpoint: "https://example.invalid/token"
          app-id: "123456"
        continue-on-error: true

      - name: Assert action failed (no OIDC available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when OIDC is unavailable, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when OIDC is unavailable"
