name: Test action fails gracefully without OIDC
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without OIDC available
        id: action
        uses: .
        continue-on-error: true
        # No provider-endpoint or app-id provided; defaults will be used.
        # No OIDC token env vars are set, so the action should fail.

      - name: Assert action failed due to missing OIDC
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without OIDC, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without OIDC token available"
