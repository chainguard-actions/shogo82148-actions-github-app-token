name: Test write-only permission violation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          # 'profile' only accepts 'write', not 'read'
          permission-profile: read
      - name: Assert action failed due to write-only permission violation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when 'read' is given for a write-only permission, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected 'read' for a write-only permission field"
