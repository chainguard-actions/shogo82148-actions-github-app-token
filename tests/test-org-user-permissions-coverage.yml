name: Test organization and user-level permission inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with organization and user-level permission inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          provider-endpoint: "https://example.invalid/token"
          permission-custom-properties-for-organizations: read
          permission-email-addresses: read
          permission-enterprise-custom-properties-for-organizations: read
          permission-followers: read
          permission-git-ssh-keys: read
          permission-gpg-keys: read
          permission-interaction-limits: read
          permission-members: read
          permission-organization-administration: read
          permission-organization-announcement-banners: read
          permission-organization-copilot-seat-management: write
          permission-organization-custom-org-roles: read
          permission-organization-custom-properties: read
          permission-organization-custom-roles: read
          permission-organization-hooks: read
          permission-organization-packages: read
          permission-organization-personal-access-token-requests: read
          permission-organization-personal-access-tokens: read
          permission-organization-plan: read
          permission-organization-projects: read
          permission-organization-secrets: read
          permission-organization-self-hosted-runners: read
          permission-organization-user-blocking: read
          permission-profile: write
          permission-starring: read
          permission-team-discussions: read

      - name: Assert action failed (no valid credentials available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without valid credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without valid credentials"
