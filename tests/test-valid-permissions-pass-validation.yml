name: Test valid permission values pass validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Provide valid permission values. The action will still fail at the OIDC
      # stage (since act doesn't provide OIDC tokens), but it should NOT fail
      # with a permission validation error. We verify the action fails (expected
      # in act environment) but that the failure is not due to invalid permissions
      # by checking that the action does fail (OIDC unavailable) rather than
      # succeeding unexpectedly.
      - id: action
        uses: .
        continue-on-error: true
        with:
          permission-contents: "read"
          permission-issues: "write"
          permission-pull-requests: "read"
          permission-metadata: "read"

      - name: Assert action failed at OIDC stage not permission validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because OIDC is not available in act,
          # not because of invalid permission values.
          # Either failure or success is acceptable here — what matters is
          # that valid permissions don't cause a "invalid permissions: N error(s) found" failure.
          # Since OIDC is unavailable, we expect failure.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at OIDC stage (expected in act environment), not at permission validation"
          else
            echo "INFO: action outcome was '$OUTCOME' — valid permissions accepted"
          fi
          echo "PASS"
