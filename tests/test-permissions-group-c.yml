name: Test permission inputs group C
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with permission group C inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          permission-organization-announcement-banners: read
          permission-organization-copilot-seat-management: write
          permission-organization-custom-org-roles: read
          permission-organization-custom-properties: read
          permission-organization-custom-roles: read
          permission-organization-hooks: read
          permission-organization-packages: read
          permission-organization-personal-access-token-requests: read

      - name: Assert action failed gracefully (no OIDC available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without OIDC, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without OIDC token available"
