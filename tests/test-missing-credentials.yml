name: Test missing credentials error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with no credentials (expect failure)
        id: action
        uses: .
        with:
          app-id: "123456"
        continue-on-error: true
      - name: Assert action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without valid credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected without valid credentials"
