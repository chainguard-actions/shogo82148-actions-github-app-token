name: Test action with custom provider endpoint
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with custom provider endpoint (expected to fail without OIDC)
        id: action
        uses: .
        with:
          provider-endpoint: "https://custom.example.invalid/token-provider"
          app-id: "999999"
          repositories: ""
        continue-on-error: true

      - name: Assert action failed gracefully with custom provider
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when OIDC is unavailable, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with custom provider endpoint when OIDC is unavailable"
