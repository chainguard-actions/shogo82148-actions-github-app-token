name: Test multiple invalid permission values
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          # 'actions' only accepts 'read' or 'write'
          permission-actions: admin
          # 'checks' only accepts 'read' or 'write'
          permission-checks: invalid
          # 'organization-events' only accepts 'read'
          permission-organization-events: write
      - name: Assert action failed due to multiple invalid permissions
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to multiple invalid permission values, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed on multiple invalid permission values"
