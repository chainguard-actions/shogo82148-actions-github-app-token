name: Test multiple invalid permission values cause failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with multiple invalid permission values
        id: action
        uses: .
        continue-on-error: true
        with:
          # "admin" is not valid for permission-contents (only "read" or "write")
          permission-contents: admin
          # "write" is not valid for permission-organization-events (only "read")
          permission-organization-events: write
          # "read" is not valid for permission-workflows (only "write")
          permission-workflows: read

      - name: Assert action failed due to multiple invalid permissions
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with multiple invalid permissions, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with multiple invalid permission values"
