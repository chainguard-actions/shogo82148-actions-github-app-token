name: Test OIDC unavailable error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires OIDC tokens (ACTIONS_ID_TOKEN_REQUEST_TOKEN and
      # ACTIONS_ID_TOKEN_REQUEST_URL). Under act, these are not available, so
      # the action will fail when trying to get the ID token.
      # We verify the action fails (continue-on-error: true) and then assert
      # that the step outcome is 'failure', confirming the action correctly
      # detects the missing OIDC provider and fails.
      - id: action
        uses: .
        continue-on-error: true
        with:
          # Use a fake provider endpoint so we don't hit the real AWS endpoint
          provider-endpoint: "http://127.0.0.1:19999/fake-provider"
          app-id: "999999"

      - name: Assert action failed due to missing OIDC
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when OIDC is unavailable, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when OIDC provider is unavailable"
