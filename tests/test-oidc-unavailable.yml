name: Test action fails gracefully when OIDC is unavailable
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires OIDC (ACTIONS_ID_TOKEN_REQUEST_TOKEN / ACTIONS_ID_TOKEN_REQUEST_URL)
      # which is not available in act. The action should fail with an error about OIDC.
      - id: action
        uses: .
        continue-on-error: true
        with:
          provider-endpoint: "https://example.invalid/token"
          app-id: "123456"

      - name: Assert action failed due to missing OIDC
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when OIDC is unavailable, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when OIDC is unavailable"
