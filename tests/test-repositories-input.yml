name: Test repositories input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repositories: "MDEwOlJlcG9zaXRvcnkxMjM0NTY3ODk="
          app-id: "123456"
          provider-endpoint: "https://invalid.example.com/token"
        continue-on-error: true
      - name: Assert action failed due to invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials when repositories input is provided"
