name: Test repositories input (graceful failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          provider-endpoint: "https://invalid.example.invalid/token"
          repositories: "MDEwOlJlcG9zaXRvcnkxMjM0NTY3ODk="
        continue-on-error: true
      - name: Assert action fails gracefully when repositories input is provided with unreachable provider
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOKEN: ${{ steps.action.outputs.token }}
        run: |
          echo "outcome: $OUTCOME"
          echo "token set: $([ -n "$TOKEN" ] && echo yes || echo no)"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TOKEN" ]; then
              echo "FAIL: action succeeded but token output is empty"
              exit 1
            fi
            echo "PASS: action succeeded and token is set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (provider endpoint unreachable or OIDC not available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
