name: Test repositories input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          provider-endpoint: "https://invalid.example.com/token"
          app-id: "12345"
          repositories: "MDEwOlJlcG9zaXRvcnkxMjM0NTY3OA=="
      - name: Assert action failed with invalid provider endpoint
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid provider endpoint, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when given an invalid provider endpoint with repositories input"
