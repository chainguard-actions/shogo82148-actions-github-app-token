name: Test invalid provider endpoint error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          provider-endpoint: "https://invalid.example.invalid/token"
        env:
          GITHUB_REF: refs/heads/main
          GITHUB_EVENT_NAME: push
      - name: Assert action failed gracefully with invalid endpoint
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid provider endpoint, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected with invalid provider endpoint"
