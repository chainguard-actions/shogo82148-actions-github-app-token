name: Test permissions batch 4 - org-copilot, org-custom-org-roles, org-custom-properties, org-custom-roles, org-hooks, org-packages, org-pat-requests, org-pats
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Pass a batch of permission inputs.
      # The action will fail at the OIDC/credential stage (expected in act),
      # but the inputs must be accepted without a validation error.
      - id: action
        uses: .
        continue-on-error: true
        with:
          permission-organization-copilot-seat-management: "write"
          permission-organization-custom-org-roles: "read"
          permission-organization-custom-properties: "read"
          permission-organization-custom-roles: "read"
          permission-organization-hooks: "read"
          permission-organization-packages: "read"
          permission-organization-personal-access-token-requests: "read"
          permission-organization-personal-access-tokens: "read"

      - name: Assert action failed at credential stage not input validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at credential stage as expected in act environment"
          else
            echo "INFO: action outcome was '$OUTCOME'"
          fi
          echo "PASS"
