name: Test action with repositories input specified
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action with a repositories input. The action parses repositories
      # as a whitespace-separated list. OIDC is unavailable in act so it will fail,
      # but we verify it fails gracefully (not a crash/unexpected error).
      - id: action
        uses: .
        continue-on-error: true
        with:
          provider-endpoint: "https://example.invalid/token"
          app-id: "123456"
          repositories: "repo-node-id-1 repo-node-id-2"

      - name: Assert action failed gracefully with repositories input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (OIDC unavailable), got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when OIDC is unavailable (repositories input accepted)"
