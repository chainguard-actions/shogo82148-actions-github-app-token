name: Test permission inputs batch one
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Pass a broad set of permission inputs. The action will fail at the OIDC
      # stage (no credentials in act), but the inputs are exercised for coverage.
      - id: action
        uses: .
        continue-on-error: true
        with:
          permission-administration: "read"
          permission-artifact-metadata: "read"
          permission-attestations: "read"
          permission-checks: "read"
          permission-codespaces: "read"
          permission-custom-properties-for-organizations: "read"
          permission-dependabot-secrets: "read"
          permission-deployments: "read"
          permission-discussions: "read"
          permission-email-addresses: "read"
          permission-enterprise-custom-properties-for-organizations: "read"
          permission-environments: "read"
          permission-followers: "read"
          permission-git-ssh-keys: "read"
          permission-gpg-keys: "read"
          permission-interaction-limits: "read"

      - name: Assert action ran (fails gracefully without credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no credentials available in act)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
