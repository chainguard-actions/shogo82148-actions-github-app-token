name: Test invalid permission value causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid permission value
        id: action
        uses: .
        continue-on-error: true
        with:
          # "invalid" is not a valid value for permission-contents (must be "read" or "write")
          permission-contents: invalid

      - name: Assert action failed due to invalid permission
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid permission, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid permission value"
