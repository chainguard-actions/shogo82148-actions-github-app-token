name: Test invalid permission value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          provider-endpoint: http://127.0.0.1:1/unused
          permission-contents: admin
          permission-organization-plan: write
          permission-workflows: read
      - name: Assert action failed validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOKEN: ${{ steps.action.outputs.token }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid permission values"
            exit 1
          fi
          if [ -n "$TOKEN" ]; then
            echo "FAIL: token should be empty"
            exit 1
          fi
          echo "PASS"
