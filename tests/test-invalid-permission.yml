name: Test invalid permission value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Provide an invalid permission value for a read/write-only field.
      # "admin" is not valid for permission-actions (only "read" or "write").
      # The action should fail with a validation error before attempting OIDC.
      - id: action
        uses: .
        continue-on-error: true
        with:
          permission-actions: "admin"

      - name: Assert action failed due to invalid permission
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid permission, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed on invalid permission value"
