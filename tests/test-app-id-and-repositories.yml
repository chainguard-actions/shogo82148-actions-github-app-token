name: Test app-id, repositories, and core permissions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with app-id, repositories, and core permissions
        id: action
        uses: .
        continue-on-error: true
        with:
          app-id: "123456"
          repositories: "MDEwOlJlcG9zaXRvcnkxMjM0NTY3ODk="
          permission-administration: read
          permission-artifact-metadata: read
          permission-attestations: read
          permission-checks: read
          permission-codespaces: read
          permission-contents: read

      - name: Assert action failed gracefully (no OIDC available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without OIDC, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without OIDC token available"
