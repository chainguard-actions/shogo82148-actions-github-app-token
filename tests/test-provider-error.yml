name: Test provider returns error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock OIDC/provider server
        run: |
          rm -f /tmp/mock-requests.log
          nohup node "$GITHUB_WORKSPACE/tests/fixtures/mock-server.js" /tmp/mock-requests.log 18081 > /tmp/mock-server.out 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18081/health >/dev/null; then
              echo "mock server ready"; exit 0
            fi
            sleep 1
          done
          cat /tmp/mock-server.out
          echo "FAIL: mock server did not start"
          exit 1
      - id: action
        uses: .
        continue-on-error: true
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: "http://127.0.0.1:18081/oidc?api-version=2.0"
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: fake-request-token
        with:
          provider-endpoint: http://127.0.0.1:18081/provider-error
          permission-contents: read
      - name: Assert action failed without a token
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOKEN: ${{ steps.action.outputs.token }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/mock-requests.log || true
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when provider returns 403"
            exit 1
          fi
          if [ -n "$TOKEN" ]; then
            echo "FAIL: token should be empty"
            exit 1
          fi
          if ! grep -q '/provider-error' /tmp/mock-requests.log; then
            echo "FAIL: provider endpoint was not called"
            exit 1
          fi
          if ! grep -F -q 'audience=https%3A%2F%2Fgithub-app.shogo82148.com%2F136245' /tmp/mock-requests.log; then
            echo "FAIL: default app-id audience not used"
            exit 1
          fi
          echo "PASS"
