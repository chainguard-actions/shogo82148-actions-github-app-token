name: Test provider error response handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Set up a mock OIDC token endpoint and a mock provider that returns an error.
      # This tests that the action correctly calls core.setFailed when the provider
      # returns a non-200 response.
      - name: Start mock servers (provider returns error)
        run: |
          # Create a mock OIDC token server (returns a fake JWT)
          cat > /tmp/mock-oidc-server-err.py << 'EOF'
          import http.server
          import json

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  resp = json.dumps({"value": "fake-oidc-token-for-testing"})
                  self.wfile.write(resp.encode())
              def log_message(self, format, *args):
                  pass

          server = http.server.HTTPServer(('127.0.0.1', 19996), Handler)
          server.serve_forever()
          EOF

          # Create a mock provider server that returns a 403 error
          cat > /tmp/mock-provider-error-server.py << 'EOF'
          import http.server
          import json

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  content_length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(content_length)
                  self.send_response(403)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  resp = json.dumps({"message": "Forbidden: invalid OIDC token"})
                  self.wfile.write(resp.encode())
              def log_message(self, format, *args):
                  pass

          server = http.server.HTTPServer(('127.0.0.1', 19995), Handler)
          server.serve_forever()
          EOF

          python3 /tmp/mock-oidc-server-err.py &
          echo $! > /tmp/oidc-server-err.pid
          python3 /tmp/mock-provider-error-server.py &
          echo $! > /tmp/provider-error-server.pid

          sleep 1
          echo "Mock error servers started"

      - id: action
        uses: .
        continue-on-error: true
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: "fake-request-token"
          ACTIONS_ID_TOKEN_REQUEST_URL: "http://127.0.0.1:19996/token?audience="
        with:
          provider-endpoint: "http://127.0.0.1:19995/"
          app-id: "136245"

      - name: Assert action failed on provider error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when provider returns error, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when provider returned an error response"

      - name: Stop mock servers
        if: always()
        run: |
          if [ -f /tmp/oidc-server-err.pid ]; then
            kill "$(cat /tmp/oidc-server-err.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/provider-error-server.pid ]; then
            kill "$(cat /tmp/provider-error-server.pid)" 2>/dev/null || true
          fi
          echo "Mock error servers stopped"
