name: Test all permission inputs forwarded to provider
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock OIDC/provider server
        run: |
          rm -f /tmp/mock-requests.log
          nohup node "$GITHUB_WORKSPACE/tests/fixtures/mock-server.js" /tmp/mock-requests.log 18080 > /tmp/mock-server.out 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/health >/dev/null; then
              echo "mock server ready"; exit 0
            fi
            sleep 1
          done
          cat /tmp/mock-server.out
          echo "FAIL: mock server did not start"
          exit 1
      - id: action
        uses: .
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: "http://127.0.0.1:18080/oidc?api-version=2.0"
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: fake-request-token
        with:
          provider-endpoint: http://127.0.0.1:18080/provider
          app-id: "12345"
          repositories: "R_abc"
          permission-actions: read
          permission-administration: write
          permission-artifact-metadata: read
          permission-attestations: write
          permission-checks: read
          permission-codespaces: write
          permission-custom-properties-for-organizations: read
          permission-dependabot-secrets: write
          permission-deployments: read
          permission-discussions: write
          permission-email-addresses: read
          permission-enterprise-custom-properties-for-organizations: admin
          permission-environments: write
          permission-followers: read
          permission-git-ssh-keys: write
          permission-gpg-keys: read
          permission-interaction-limits: write
          permission-members: read
          permission-merge-queues: write
          permission-metadata: read
          permission-organization-administration: write
          permission-organization-announcement-banners: read
          permission-organization-copilot-seat-management: write
          permission-organization-custom-org-roles: read
          permission-organization-custom-properties: admin
          permission-organization-custom-roles: write
          permission-organization-events: read
          permission-organization-hooks: write
          permission-organization-packages: read
          permission-organization-personal-access-token-requests: write
          permission-organization-personal-access-tokens: read
          permission-organization-projects: admin
          permission-organization-secrets: write
          permission-organization-self-hosted-runners: read
          permission-organization-user-blocking: write
          permission-packages: read
          permission-pages: write
          permission-profile: write
          permission-pull-requests: read
          permission-repository-custom-properties: write
          permission-repository-hooks: read
          permission-secret-scanning-alerts: write
          permission-secrets: read
          permission-security-events: write
          permission-single-file: read
          permission-starring: write
          permission-statuses: read
          permission-team-discussions: write
          permission-vulnerability-alerts: read
      - name: Assert token output
        env:
          ACTUAL: ${{ steps.action.outputs.token }}
        run: |
          echo "token length: ${#ACTUAL}"
          if [ "$ACTUAL" != "ghs_mocktoken1234567890" ]; then
            echo "FAIL: unexpected token output"
            exit 1
          fi
          echo "PASS"
      - name: Assert all permissions sent
        run: |
          cat /tmp/mock-requests.log
          fail=0
          check() {
            if grep -F -q -- "$1" /tmp/mock-requests.log; then
              echo "ok: $1"
            else
              echo "FAIL: missing $1"; fail=1
            fi
          }
          check '"actions":"read"'
          check '"administration":"write"'
          check '"artifact_metadata":"read"'
          check '"attestations":"write"'
          check '"checks":"read"'
          check '"codespaces":"write"'
          check '"custom_properties_for_organizations":"read"'
          check '"dependabot_secrets":"write"'
          check '"deployments":"read"'
          check '"discussions":"write"'
          check '"email_addresses":"read"'
          check '"enterprise_custom_properties_for_organizations":"admin"'
          check '"environments":"write"'
          check '"followers":"read"'
          check '"git_ssh_keys":"write"'
          check '"gpg_keys":"read"'
          check '"interaction_limits":"write"'
          check '"members":"read"'
          check '"merge_queues":"write"'
          check '"metadata":"read"'
          check '"organization_administration":"write"'
          check '"organization_announcement_banners":"read"'
          check '"organization_copilot_seat_management":"write"'
          check '"organization_custom_org_roles":"read"'
          check '"organization_custom_properties":"admin"'
          check '"organization_custom_roles":"write"'
          check '"organization_events":"read"'
          check '"organization_hooks":"write"'
          check '"organization_packages":"read"'
          check '"organization_personal_access_token_requests":"write"'
          check '"organization_personal_access_tokens":"read"'
          check '"organization_projects":"admin"'
          check '"organization_secrets":"write"'
          check '"organization_self_hosted_runners":"read"'
          check '"organization_user_blocking":"write"'
          check '"packages":"read"'
          check '"pages":"write"'
          check '"profile":"write"'
          check '"pull_requests":"read"'
          check '"repository_custom_properties":"write"'
          check '"repository_hooks":"read"'
          check '"secret_scanning_alerts":"write"'
          check '"secrets":"read"'
          check '"security_events":"write"'
          check '"single_file":"read"'
          check '"starring":"write"'
          check '"statuses":"read"'
          check '"team_discussions":"write"'
          check '"vulnerability_alerts":"read"'
          [ "$fail" = 0 ] || exit 1
          echo "PASS"
