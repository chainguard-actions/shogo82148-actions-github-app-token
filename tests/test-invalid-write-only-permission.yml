name: Test invalid write-only permission value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          provider-endpoint: https://invalid.example.invalid/
          permission-workflows: read
          permission-organization-events: write
      - name: Assert action failed on invalid permissions and produced no token
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOKEN: ${{ steps.action.outputs.token }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid write-only/read-only permissions"
            exit 1
          fi
          if [ -n "$TOKEN" ]; then
            echo "FAIL: token output should be empty"
            exit 1
          fi
          echo "PASS"
