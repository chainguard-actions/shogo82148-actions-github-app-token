name: Test invalid write-only permission value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # permission-organization-events only accepts "read".
      # Providing "write" should cause the action to fail with a validation error.
      - id: action
        uses: .
        continue-on-error: true
        with:
          permission-organization-events: "write"

      - name: Assert action failed due to invalid read-only permission
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid read-only permission, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed on invalid read-only permission value"
