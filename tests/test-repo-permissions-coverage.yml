name: Test repository-level permission inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with repository-level permission inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          provider-endpoint: "https://example.invalid/token"
          app-id: "12345"
          repositories: "MDEwOlJlcG9zaXRvcnkxMjM0NTY3ODk="
          permission-actions: read
          permission-administration: read
          permission-artifact-metadata: read
          permission-attestations: read
          permission-checks: read
          permission-codespaces: read
          permission-dependabot-secrets: read
          permission-deployments: read
          permission-discussions: read
          permission-environments: read
          permission-issues: read
          permission-merge-queues: read
          permission-metadata: read
          permission-packages: read
          permission-pages: read
          permission-pull-requests: read
          permission-repository-custom-properties: read
          permission-repository-hooks: read
          permission-repository-projects: read
          permission-secret-scanning-alerts: read
          permission-secrets: read
          permission-security-events: read
          permission-single-file: read
          permission-statuses: read
          permission-vulnerability-alerts: read

      - name: Assert action failed (no valid credentials available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without valid credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without valid credentials"
