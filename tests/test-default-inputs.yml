name: Test action uses default inputs when none specified
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action with no inputs — it should use the built-in defaults
      # (defaultProviderEndpoint and defaultAppID). OIDC is unavailable in act,
      # so the action will fail, but we verify it fails (not errors unexpectedly).
      - id: action
        uses: .
        continue-on-error: true

      - name: Assert action failed gracefully with default inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (OIDC unavailable), got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with default inputs when OIDC is unavailable"
