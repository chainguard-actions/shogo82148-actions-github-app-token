name: Test action with default inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with all default inputs (expected to fail without OIDC)
        id: action
        uses: .
        continue-on-error: true

      - name: Assert action failed gracefully with default inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when OIDC is unavailable, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with default inputs when OIDC is unavailable"
